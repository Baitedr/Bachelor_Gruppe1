# Deploy-konfigurasjon for slides-api-tjenesten.
# Definerer servere, SSH-tilgang, proxy, Docker image, miljøvariabler, secrets og Redis-tilbehør.
# Brukes for å automatisere utrulling og drift av backend-applikasjonen på slides.rubynor.com.

secrets_path: .env

service: slides


image: t3lluz/slides-api

servers:
  web:
    - 204.168.207.248

ssh:
  user: root
  keys:
    - ~/.ssh/id_ed25519

proxy:
  ssl: true
  host: slides.rubynor.com
  app_port: 3000

registry:
  
  username: t3lluz
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
 
  context: ..
  dockerfile: Dockerfile

env:
  clear:
   
    REDIS_URL: redis://slides-redis:6379/1
    # Frontend-opprinnelser som er tillatt av CORS (kommaseparert)
    ALLOWED_ORIGINS: https://slides.rubynor.com
    # OAuth-omdirigering (må matche offentlig nettadresse)
    FRONTEND_URL: https://slides.rubynor.com
    # Callback-URL mot Google/GitHub må bruke offentlig https (Kamal-proxy).
    OMNIAUTH_FULL_HOST: https://slides.rubynor.com
  # Inkluder GOOGLE_* og/eller GITHUB_* i backend/.env (tomme verdier = den leverandøren er deaktivert i omniauth.rb).
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET

accessories:
  redis:
    image: redis:7
    host: 204.168.207.248
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data



aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
