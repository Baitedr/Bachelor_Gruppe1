# Kamal deploy for slides.rubynor.com (VPS from Rubynor).
# Docker build context is the repo root so the image includes the Vite frontend in public/.
# Run from the backend/ folder (Kamal config lives here), e.g.:
#   cd backend
#   bundle exec kamal deploy
# From repo root (Windows):  .\scripts\kamal.ps1 deploy
#
# Kamal reads `.env` for secrets (see `.env.example`). Use an SSH key that can reach `servers.web`.

secrets_path: .env

service: slides

# Replace with your registry image, e.g. docker.io/myuser/slides-api or ghcr.io/org/slides-api
image: t3lluz/slides-api

servers:
  web:
    - 204.168.207.248

proxy:
  ssl: true
  host: slides.rubynor.com
  app_port: 3000

registry:
  # Docker Hub: username must match the namespace in image (e.g. t3lluz/slides-api → t3lluz).
  # For GHCR, set server: ghcr.io and username to your GitHub username.
  username: t3lluz
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Parent of backend/ = monorepo root (frontend + backend in one image).
  # dockerfile is resolved from cwd (backend/), not from context — use Dockerfile not backend/Dockerfile.
  context: ..
  dockerfile: Dockerfile

env:
  clear:
    # Action Cable (production uses redis adapter — see config/cable.yml)
    REDIS_URL: redis://slides-redis:6379/1
    # Frontend origins allowed by CORS (comma-separated)
    ALLOWED_ORIGINS: https://slides.rubynor.com
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL

accessories:
  redis:
    image: redis:7
    host: 204.168.207.248
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data

# Optional Postgres on the same VPS: add a `postgres:` entry under accessories (see Kamal docs),
# set POSTGRES_PASSWORD in secrets, and point DATABASE_URL at the accessory host, e.g.
# postgresql://slides:PASSWORD@slides-postgres:5432/slides_production

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
